<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  fill="none"
  role="img"
  aria-labelledby="title desc">
  <title id="title">Oiko — templo simplificado</title>
  <desc id="desc">Ícone minimalista de templo com frontão triangular e três colunas.</desc>

  <g
    stroke="#2C6E7F"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke">

    <!-- Frontão + viga -->
    <path d="M8 24 L32 9 L56 24" />
    <path d="M11 27 H53" />

    <!-- Três colunas -->
    <path d="M19 31 V54" />
    <path d="M32 31 V54" />
    <path d="M45 31 V54" />
  </g>
</svg>
